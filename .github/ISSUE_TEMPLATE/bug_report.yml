name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens and what did you expect
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hub version and cards version
      description: Entity "Immergas Hub - Project version" and the cards version from the browser console (IMMERGAS-HUB-CARDS x.y.z)
    validations:
      required: true
  - type: input
    id: units
    attributes:
      label: Indoor and outdoor unit models
    validations:
      required: true
  - type: textarea
    id: connectivity
    attributes:
      label: Connectivity card
      description: Screenshot of the Connectivity card, or which buses are green / red
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The ESPHome log around the moment it happens (attach as a file)
