# Immergas OpenTherm - package "ot_control"
# What the hub sends to the boiler: CH and DHW enable (Data-ID 0 master flags), the CH flow setpoint (1, every cycle),
# the DHW setpoint (56), the max. CH setpoint (57) and the max. modulation (14), each repeated - an OpenTherm master
# keeps sending its values. In the gateway mode the same values are used while the room unit is silent (standalone)
# and, with their override switches on, replace what the room unit writes.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

switch:
  - platform: immergas_ot
    type: ch_enable
    name: "${n_ot_ch_enable}"
    id: ot_ch_enable
    icon: mdi:radiator
    restore_mode: RESTORE_DEFAULT_ON
  - platform: immergas_ot
    type: dhw_enable
    name: "${n_ot_dhw_enable}"
    id: ot_dhw_enable
    icon: mdi:water-boiler
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: immergas_ot
    data_id: 1
    period: 0s
    name: "${n_ot_ch_setpoint}"
    id: ot_ch_setpoint
    icon: mdi:thermometer-water
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 10
    max_value: 85
    step: 0.5
    initial_value: 45
    mode: box
  - platform: immergas_ot
    data_id: 56
    period: 30s
    name: "${n_ot_dhw_setpoint}"
    id: ot_dhw_setpoint
    icon: mdi:water-thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 35
    max_value: 60
    step: 1
    initial_value: 48
    mode: box
  - platform: immergas_ot
    data_id: 57
    period: 60s
    name: "${n_ot_max_ch_setpoint}"
    id: ot_max_ch_setpoint
    icon: mdi:thermometer-high
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 25
    max_value: 85
    step: 1
    initial_value: 80
    mode: box
  - platform: immergas_ot
    data_id: 14
    period: 60s
    name: "${n_ot_max_modulation}"
    id: ot_max_modulation
    icon: mdi:fire-circle
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    mode: box
