# IMMERGAS Modbus BMS NASA Hub - package "hub_boiler_params"
# Settings the cards need that none of the three buses carries. Boiler menu: night function window (U12/U13), anti-legionella start
# time, day and maximum duration (P16/P17/P13), the flow limit and the screed type of an underfloor circuit, the outdoor points of the
# heating and cooling curves (R02/R03, R10/R11) and the outdoor probe correction (P07). They do NOT change anything
# in the boiler: set them once to the same values as in the boiler menu, the cards use them to show the night window,
# the next anti-legionella cycle and the floor limit on the curve. Calibration card: cheaper tariff hours and the
# start of the before / after comparison. Remembered after a restart.
# Part of jotuera/immergas-modbus-bms-nasa-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

datetime:
  - platform: template
    id: hub_u12_night_start
    name: "${n_hub_u12}"
    type: time
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "22:00:00"
  - platform: template
    id: hub_u13_night_stop
    name: "${n_hub_u13}"
    type: time
    icon: mdi:weather-sunset-up
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"
  - platform: template
    id: hub_p16_legionella_time
    name: "${n_hub_p16}"
    type: time
    icon: mdi:bacteria-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "02:00:00"

  # date of the last change of settings: the card compares the time after it with the same time before it
  - platform: template
    id: hub_compare_since
    name: "${n_hub_compare_since}"
    type: datetime
    icon: mdi:calendar-start
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "2000-01-01 00:00:00"

select:
  # option index: 0 = daily, 1-7 = Monday-Sunday (the cards read the index, so any language works)
  - platform: template
    id: hub_p17_legionella_day
    name: "${n_hub_p17}"
    icon: mdi:calendar-week
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["${t_hub_day0}", "${t_hub_day1}", "${t_hub_day2}", "${t_hub_day3}", "${t_hub_day4}", "${t_hub_day5}", "${t_hub_day6}", "${t_hub_day7}"]
    initial_option: "${t_hub_day7}"
  # option index: 0 = cement screed, 1 = anhydrite screed, 2 = dry system (the cards read the index): how fast the floor
  # takes and gives back heat - Calibration uses it for the floor limit, setbacks, the CH schedule and I04
  - platform: template
    id: hub_floor_type
    name: "${n_hub_floor_type}"
    icon: mdi:layers-triple-outline
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["${t_hub_floor0}", "${t_hub_floor1}", "${t_hub_floor2}"]
    initial_option: "${t_hub_floor0}"

number:
  - platform: template
    id: hub_p13_legionella_hours
    name: "${n_hub_p13}"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "h"
    min_value: 1
    max_value: 24
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 3
  - platform: template
    id: hub_floor_flow_limit
    name: "${n_hub_floor_max}"
    icon: mdi:heating-coil
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 25
    max_value: 60
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 45
  # boiler menu R / P values the buses do not carry (copied once from the boiler; the curve card and Calibration use them)
  - platform: template
    id: hub_r02_outdoor_max_flow
    name: "${n_hub_r02}"
    icon: mdi:thermometer-low
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: -30
    max_value: 10
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: -12
  - platform: template
    id: hub_r03_outdoor_min_flow
    name: "${n_hub_r03}"
    icon: mdi:thermometer-high
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 0
    max_value: 30
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 20
  - platform: template
    id: hub_r10_outdoor_min_cool
    name: "${n_hub_r10}"
    icon: mdi:thermometer-high
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 20
    max_value: 45
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 35
  - platform: template
    id: hub_r11_outdoor_max_cool
    name: "${n_hub_r11}"
    icon: mdi:thermometer-low
    entity_category: config
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 15
    max_value: 40
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 25
  - platform: template
    id: hub_p07_probe_correction
    name: "${n_hub_p07}"
    icon: mdi:thermometer-plus
    entity_category: config
    unit_of_measurement: "°C"
    min_value: -9
    max_value: 9
    step: 1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0

# --- U11 night function is a boiler menu setting the buses do not show (D+/D- only shows when it is active) -----------
switch:
  - platform: template
    id: hub_u11_set
    name: "${n_hub_u11_set}"
    icon: mdi:weather-night
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# --- for the Calibration card: cheaper tariff hours and the start of the before / after comparison ---------------------
text:
  # e.g. "13:00-15:00,22:00-06:00" for a two-rate tariff (G12); empty = one rate all day
  - platform: template
    id: hub_cheap_hours
    name: "${n_hub_cheap_hours}"
    icon: mdi:cash-clock
    entity_category: config
    mode: text
    max_length: 64
    optimistic: true
    restore_value: true
    initial_value: ""

button:
  - platform: template
    name: "${n_hub_compare_now}"
    icon: mdi:flag-checkered
    entity_category: config
    on_press:
      - lambda: |-
          auto now = id(f1f2_time).now();
          if (!now.is_valid()) return;
          auto call = id(hub_compare_since).make_call();
          call.set_datetime(now);
          call.perform();
