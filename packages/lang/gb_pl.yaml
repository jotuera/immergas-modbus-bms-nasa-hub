# Immergas gas boiler Modbus BMS - language file: Polski
# Entity names (n_gb_*) and texts shown in Home Assistant (t_gb_*). Pick ONE gb_ language file in the packages list.
# Changing the language renames the entities: Home Assistant then creates new entities (history stays on the old ones).

substitutions:
  # texts
  t_gb_mode_standby: "Stand-by"
  t_gb_mode_dhw: "Tylko CWU"
  t_gb_mode_heating: "Ogrzewanie"
  t_gb_mode_dhw_heating: "Ogrzewanie + CWU"
  t_gb_no_fault: "Brak usterki"
  t_gb_fault_144: "BMS offline (brak mastera Modbus przez 30 s)"
  t_gb_fault_100: "utrata połączenia z urządzeniem zewnętrznym"
  # entity names
  n_gb_bms_connection: "${gb_name_prefix} - Połączenie BMS"
  n_gb_heat_request: "${gb_name_prefix} - Żądanie grzania (CO)"
  n_gb_control_raw: "${gb_name_prefix} - Sterowanie kotłem (surowe)"
  n_gb_mode: "${gb_name_prefix} - Tryb pracy"
  n_gb_ch_setpoint: "${gb_name_prefix} - Nastawa zasilania CO"
  n_gb_dhw_setpoint: "${gb_name_prefix} - Nastawa CWU"
