# Immergas MAGIS M (Midea M-Thermal) Modbus - package "mt_sensors"
# Running values (holding 100-142): compressor, fan, expansion valve, water / refrigerant / outdoor / room / DHW
# temperatures, pressures, current and voltage, flow and heat output. Temperatures follow the resolution flag of
# mt_core (1 °C or 0.1 °C); 0x7F / 0x7FFF / 0xFF / 0xFFFF and -32768 = no probe.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

sensor:
  - platform: modbus_controller
    modbus_controller_id: mt_hp
    name: "${n_mt_compressor_freq}"
    id: mt_compressor_freq
    icon: mdi:sine-wave
    register_type: holding
    address: 100
    value_type: U_WORD
    unit_of_measurement: "Hz"
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: mt_hp
    name: "${n_mt_fan_speed}"
    id: mt_fan_speed
    icon: mdi:fan
    register_type: holding
    address: 102
    value_type: U_WORD
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: mt_hp_slow
    name: "${n_mt_eev}"
    id: mt_eev
    icon: mdi:valve
    entity_category: diagnostic
    register_type: holding
    address: 103
    value_type: U_WORD
    unit_of_measurement: "steps"
    state_class: measurement
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: mt_hp
    name: "${n_mt_water_in}"
    id: mt_water_in
    register_type: holding
    address: 104
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: &mt_temp |-
          int v = (int) x;
          if (v == 0x7F || v == 0x7FFF || v == 0xFF || v == -32768 || v == -1) return NAN;
          return id(mt_hires) ? x * 0.1f : x;
  - platform: modbus_controller
    modbus_controller_id: mt_hp
    name: "${n_mt_water_out}"
    id: mt_water_out
    register_type: holding
    address: 105
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: *mt_temp
  - platform: modbus_controller
    modbus_controller_id: mt_hp_slow
    name: "${n_mt_t3_condenser}"
    id: mt_t3_condenser
    entity_category: diagnostic
    register_type: holding
    address: 106
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: *mt_temp
  - platform: modbus_controller
    modbus_controller_id: mt_hp
    name: "${n_mt_outdoor_temp}"
    id: mt_outdoor_temp
    register_type: holding
    address: 107
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: *mt_temp
  - platform: modbus_controller
    modbus_controller_id: mt_hp_slow
    name: "${n_mt_discharge_temp}"
    id: mt_discharge_temp
    entity_category: diagnostic
    register_type: holding
    address: 108
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: *mt_temp
  - platform: modbus_controller
    modbus_controller_id: mt_hp_slow
    name: "${n_mt_suction_temp}"
    id: mt_suction_temp
    entity_category: diagnostic
    register_type: holding
    address: 109
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
