    filters:
      - lambda: *mt_temp
  # pressures in kPa (protocol before V4.6 reported x10 kPa - compare with the controller display)
  - platform: modbus_controller
    modbus_controller_id: mt_hp_slow
    name: "${n_mt_pressure_high}"
    id: mt_pressure_high
