  # water flow in 0.01 m³/h, shown in l/min
  - platform: modbus_controller
    modbus_controller_id: mt_hp
    name: "${n_mt_water_flow}"
    id: mt_water_flow
    icon: mdi:water-pump
    register_type: holding
    address: 138
    value_type: U_WORD
    unit_of_measurement: "L/min"
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.16667   # 0.01 m³/h = 10 l / 60 min
  # heat output of the hydro module, 0.01 kW
  - platform: modbus_controller
    modbus_controller_id: mt_hp
    name: "${n_mt_heat_output}"
    id: mt_heat_output
    register_type: holding
    address: 140
    value_type: U_WORD
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
