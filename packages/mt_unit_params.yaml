# Immergas MAGIS M (Midea M-Thermal) Modbus - package "mt_unit_params" (optional, with mt_stats)
# The service reminder of the unit (last service, interval, "service done", due). Nothing is sent to the unit.
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

select:
  - { platform: template, name: "${n_mt_maint}", id: mt_maint, icon: "mdi:wrench-clock", options: ["off", "6", "12", "18", "24"], initial_option: "12", restore_value: true, optimistic: true, entity_category: config }

datetime:
  - { platform: template, type: date, name: "${n_mt_last_srv}", id: mt_last_srv, icon: "mdi:calendar-check", optimistic: true, restore_value: true, entity_category: config }

button:
  - platform: template
    name: "${n_mt_srv_done}"
    id: mt_srv_done
    icon: mdi:wrench-check
    on_press:
      - lambda: |-
          auto now = id(mt_time).now();
          if (!now.is_valid()) return;
          auto c = id(mt_last_srv).make_call();
          c.set_date(now.year, now.month, now.day_of_month);
          c.perform();

binary_sensor:
  - platform: template
    name: "${n_mt_maint_due}"
    id: mt_maint_due
    icon: mdi:wrench-clock
    device_class: problem
    lambda: |-
      std::string m = id(mt_maint).current_option();
      auto now = id(mt_time).now();
      if (m == "off" || !id(mt_last_srv).has_state() || !now.is_valid()) return false;
      int months = atoi(m.c_str());
      int y = id(mt_last_srv).year, mo = id(mt_last_srv).month - 1 + months, d = std::min((int) id(mt_last_srv).day, 28);
      y += mo / 12; mo = mo % 12 + 1;
      long due = (long) y * 10000 + mo * 100 + d, today = (long) now.year * 10000 + now.month * 100 + now.day_of_month;
      return today >= due;
