select:
  - platform: template
    name: "${n_mt_mode}"
    update_interval: 10s
    id: mt_mode
    icon: mdi:heat-pump
    options: ["${t_mt_mode_auto}", "${t_mt_mode_cool}", "${t_mt_mode_heat}"]
    lambda: |-
      if (isnan(id(mt_r1).state)) return {};
      switch ((int) id(mt_r1).state) {
        case 1: return std::string("${t_mt_mode_auto}");
        case 2: return std::string("${t_mt_mode_cool}");
        case 3: return std::string("${t_mt_mode_heat}");
        default: return {};
      }
    set_action:
      - lambda: |-
          int v = x == "${t_mt_mode_auto}" ? 1 : x == "${t_mt_mode_cool}" ? 2 : 3;
          id(mt_r1).publish_state(v);
          id(mt_write).execute(1, v);
  - platform: template
    name: "${n_mt_curve_z1}"
    update_interval: 10s
    id: mt_curve_z1
    icon: mdi:chart-bell-curve-cumulative
    options: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    lambda: |-
      if (isnan(id(mt_r6).state)) return {};
      int v = (int) id(mt_r6).state & 0xFF;
      if (v < 1 || v > 9) return {};
      return to_string(v);
    set_action:
      - script.execute: { id: mt_set_byte, reg: 6, high: false, value: !lambda "return atoi(x.c_str());" }
  - platform: template
    name: "${n_mt_curve_z2}"
    update_interval: 10s
    id: mt_curve_z2
    icon: mdi:chart-bell-curve-cumulative
    disabled_by_default: true
    options: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
    lambda: |-
      if (isnan(id(mt_r6).state)) return {};
      int v = ((int) id(mt_r6).state >> 8) & 0xFF;
      if (v < 1 || v > 9) return {};
      return to_string(v);
    set_action:
      - script.execute: { id: mt_set_byte, reg: 6, high: true, value: !lambda "return atoi(x.c_str());" }
  # 7 / 8 / 9: 0 = as programmed, 1 = forced on, 2 = forced off
  - platform: template
    name: "${n_mt_force_dhw}"
    update_interval: 10s
    id: mt_force_dhw
    icon: mdi:water-boiler-alert
    options: ["${t_mt_force_normal}", "${t_mt_force_on}", "${t_mt_force_off}"]
    lambda: |-
      if (isnan(id(mt_r7).state)) return {};
      int v = (int) id(mt_r7).state;
      return std::string(v == 1 ? "${t_mt_force_on}" : v == 2 ? "${t_mt_force_off}" : "${t_mt_force_normal}");
    set_action:
      - lambda: |-
          int v = x == "${t_mt_force_on}" ? 1 : x == "${t_mt_force_off}" ? 2 : 0;
          id(mt_r7).publish_state(v);
          id(mt_write).execute(7, v);
  - platform: template
    name: "${n_mt_force_tbh}"
    update_interval: 10s
    id: mt_force_tbh
    icon: mdi:heating-coil
    entity_category: config
    options: ["${t_mt_force_normal}", "${t_mt_force_on}", "${t_mt_force_off}"]
    lambda: |-
      if (isnan(id(mt_r8).state)) return {};
      int v = (int) id(mt_r8).state;
      return std::string(v == 1 ? "${t_mt_force_on}" : v == 2 ? "${t_mt_force_off}" : "${t_mt_force_normal}");
    set_action:
      - lambda: |-
          int v = x == "${t_mt_force_on}" ? 1 : x == "${t_mt_force_off}" ? 2 : 0;
          id(mt_r8).publish_state(v);
          id(mt_write).execute(8, v);
  - platform: template
    name: "${n_mt_force_ibh}"
    update_interval: 10s
    id: mt_force_ibh
    icon: mdi:heating-coil
    entity_category: config
    options: ["${t_mt_force_normal}", "${t_mt_force_on}", "${t_mt_force_off}"]
    lambda: |-
      if (isnan(id(mt_r9).state)) return {};
      int v = (int) id(mt_r9).state;
      return std::string(v == 1 ? "${t_mt_force_on}" : v == 2 ? "${t_mt_force_off}" : "${t_mt_force_normal}");
    set_action:
      - lambda: |-
          int v = x == "${t_mt_force_on}" ? 1 : x == "${t_mt_force_off}" ? 2 : 0;
          id(mt_r9).publish_state(v);
          id(mt_write).execute(9, v);

number:
  # 2 low byte: water setpoint zone 1 (with 0.1 °C resolution the byte holds °C x 2)
  - platform: template
    name: "${n_mt_water_set_z1}"
    update_interval: 10s
    id: mt_water_set_z1
    icon: mdi:thermometer-water
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 5
    max_value: 65
    step: 1
    mode: box
    lambda: |-
      if (isnan(id(mt_r2).state)) return {};
      int b = (int) id(mt_r2).state & 0xFF;
      return id(mt_hires) ? b * 0.5f : (float) b;
    set_action:
      - script.execute: { id: mt_set_byte, reg: 2, high: false, value: !lambda "return (int) roundf(id(mt_hires) ? x * 2.0f : x);" }
  - platform: template
    name: "${n_mt_water_set_z2}"
    update_interval: 10s
    id: mt_water_set_z2
    icon: mdi:thermometer-water
    disabled_by_default: true
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 5
    max_value: 65
    step: 1
    mode: box
    lambda: |-
      if (isnan(id(mt_r2).state)) return {};
      int b = ((int) id(mt_r2).state >> 8) & 0xFF;
      return id(mt_hires) ? b * 0.5f : (float) b;
    set_action:
      - script.execute: { id: mt_set_byte, reg: 2, high: true, value: !lambda "return (int) roundf(id(mt_hires) ? x * 2.0f : x);" }
  # 3: room setpoint, value = °C x 2
  - platform: template
    name: "${n_mt_room_set}"
    update_interval: 10s
    id: mt_room_set
    icon: mdi:home-thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 17
    max_value: 30
    step: 0.5
    mode: box
    lambda: |-
      if (isnan(id(mt_r3).state)) return {};
      return id(mt_r3).state * 0.5f;
    set_action:
      - lambda: |-
          int v = (int) roundf(x * 2.0f);
          id(mt_r3).publish_state(v);
          id(mt_write).execute(3, v);
  # 4: DHW setpoint
  - platform: template
    name: "${n_mt_dhw_set}"
    update_interval: 10s
    id: mt_dhw_set
    icon: mdi:water-thermometer
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 20
    max_value: 65
    step: 1
    mode: box
    lambda: |-
      if (isnan(id(mt_r4).state)) return {};
      return id(mt_r4).state;
    set_action:
      - lambda: |-
          int v = (int) roundf(x);
          id(mt_r4).publish_state(v);
          id(mt_write).execute(4, v);
