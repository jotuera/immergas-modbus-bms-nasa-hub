# Immergas MAGIS M (Midea M-Thermal) Modbus - package "mt_control"
# Control registers 0-9: on / off per circuit (0, bits), operating mode (1), water setpoints zone 1 / 2 (2, low / high
# byte), room setpoint (3), DHW setpoint (4), functions (5, bits: disinfection, silent, ECO, weather curves), weather
# curve number zone 1 / 2 (6), forced DHW / tank heater / backup heater (7-9). Registers 0, 2, 5 and 6 hold several
# values: a change writes the register again with only its own bits / byte changed (read-modify-write from the last
# read, so wait for the first reading after a start before changing anything).
# Part of jotuera/immergas-modbus-bms-nasa-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

sensor:
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r0, name: "${n_mt_r0}", internal: true, register_type: holding, address: 0, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r1, name: "${n_mt_r1}", internal: true, register_type: holding, address: 1, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r2, name: "${n_mt_r2}", internal: true, register_type: holding, address: 2, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r3, name: "${n_mt_r3}", internal: true, register_type: holding, address: 3, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r4, name: "${n_mt_r4}", internal: true, register_type: holding, address: 4, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r5, name: "${n_mt_r5}", internal: true, register_type: holding, address: 5, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r6, name: "${n_mt_r6}", internal: true, register_type: holding, address: 6, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r7, name: "${n_mt_r7}", internal: true, register_type: holding, address: 7, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r8, name: "${n_mt_r8}", internal: true, register_type: holding, address: 8, value_type: U_WORD, accuracy_decimals: 0 }
  - { platform: modbus_controller, modbus_controller_id: mt_hp, id: mt_r9, name: "${n_mt_r9}", internal: true, register_type: holding, address: 9, value_type: U_WORD, accuracy_decimals: 0 }

script:
  # set (on = true) or clear the bits of `mask` in bit-field register 0 or 5
  - id: mt_set_bits
    mode: queued
    max_runs: 10
    parameters:
      reg: int
      mask: int
      enable: bool
    then:
      - lambda: |-
          auto *src = reg == 0 ? id(mt_r0) : id(mt_r5);
          if (isnan(src->state)) { ESP_LOGW("mt_hp", "register %d not read yet - change skipped", reg); return; }
          int v = (int) src->state;
          v = enable ? (v | mask) : (v & ~mask);
          src->publish_state(v);
          id(mt_write).execute(reg, v);
  # write the low (zone 1) or the high (zone 2) byte of register 2 or 6
  - id: mt_set_byte
    mode: queued
    max_runs: 10
    parameters:
      reg: int
      high: bool
      value: int
    then:
      - lambda: |-
          auto *src = reg == 2 ? id(mt_r2) : id(mt_r6);
          if (isnan(src->state)) { ESP_LOGW("mt_hp", "register %d not read yet - change skipped", reg); return; }
          int v = (int) src->state;
          v = high ? ((v & 0x00FF) | ((value & 0xFF) << 8)) : ((v & 0xFF00) | (value & 0xFF));
          src->publish_state(v);
          id(mt_write).execute(reg, v);

switch:
  - platform: template
    name: "${n_mt_power_zone1}"
    id: mt_power_zone1
    icon: mdi:radiator
    lambda: |-
      if (isnan(id(mt_r0).state)) return {};
      return ((int) id(mt_r0).state & 0x0002) != 0;
    turn_on_action:
      - script.execute: { id: mt_set_bits, reg: 0, mask: 0x0002, enable: true }
    turn_off_action:
      - script.execute: { id: mt_set_bits, reg: 0, mask: 0x0002, enable: false }
