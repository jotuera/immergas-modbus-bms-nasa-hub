# Immergas Modbus BMS - package "gb_programs" (optional)
# The programs a room unit / Dominus would keep, run in the hub for a gas boiler over BMS (no room temperature here, so
# Comfort / Eco act on the flow):
#   - CH program AUTO by 4 calendars (4 ranges each) and a calendar per weekday: Comfort = the normal flow setpoint (or
#     the hub weather curve); Eco = the flow lowered by "Eco flow reduction" or no heat request at all (CH stands);
#   - DHW program: Comfort / Eco DHW setpoint by the same calendars, own weekday assignment;
#   - anti-legionella: weekly (Monday) or daily at 02:00 the DHW setpoint goes to the anti-legionella temperature (capped
#     by the boiler's DHW max.) until the cylinder holds it for 20 min (at most 2 h);
#   - vacation: Standby or DHW only until the end date (or until switched off), then the mode from before;
#   - automatic Summer / Winter by the 24 h outdoor mean (from the boiler's outdoor probe).
# Needs gb_core, gb_control, gb_status, gb_sensors and gb_curve (it may stay off; with it on, Eco shifts the curve).
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

globals:
  - { id: gb_phase_last, type: int, initial_value: "-1" }       # CH program: 1 Comfort, 0 Eco
  - { id: gb_flow_before, type: float, initial_value: "NAN" }   # flow setpoint before Eco (curve off)
  - { id: gb_dhw_phase_last, type: int, initial_value: "-1" }
  - { id: gb_leg_run_g, type: bool, initial_value: "false" }
  - { id: gb_leg_start, type: uint32_t, initial_value: "0" }
  - { id: gb_leg_hold, type: uint32_t, initial_value: "0" }
  - { id: gb_leg_day_done, type: int, initial_value: "-1" }
  - { id: gb_leg_dhw_before, type: float, initial_value: "NAN" }
  - { id: gb_vac_mode_before, type: int, restore_value: true, initial_value: "-1" }
  - { id: gb_season, type: int, restore_value: true, initial_value: "-1" }
  - { id: gb_out_sum, type: float, initial_value: "0" }
  - { id: gb_out_n, type: int, initial_value: "0" }
  - { id: gb_out_hist, type: "std::vector<float>" }

datetime:
  - { platform: template, type: time, name: "${n_gb_k1z1on}", id: gb_k1z1on, optimistic: true, restore_value: true, initial_value: "06:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k1z1off}", id: gb_k1z1off, optimistic: true, restore_value: true, initial_value: "22:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k1z2on}", id: gb_k1z2on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k1z2off}", id: gb_k1z2off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k1z3on}", id: gb_k1z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k1z3off}", id: gb_k1z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k1z4on}", id: gb_k1z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k1z4off}", id: gb_k1z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k2z1on}", id: gb_k2z1on, optimistic: true, restore_value: true, initial_value: "06:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k2z1off}", id: gb_k2z1off, optimistic: true, restore_value: true, initial_value: "08:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k2z2on}", id: gb_k2z2on, optimistic: true, restore_value: true, initial_value: "15:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k2z2off}", id: gb_k2z2off, optimistic: true, restore_value: true, initial_value: "22:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k2z3on}", id: gb_k2z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k2z3off}", id: gb_k2z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k2z4on}", id: gb_k2z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k2z4off}", id: gb_k2z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k3z1on}", id: gb_k3z1on, optimistic: true, restore_value: true, initial_value: "05:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k3z1off}", id: gb_k3z1off, optimistic: true, restore_value: true, initial_value: "07:30:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k3z2on}", id: gb_k3z2on, optimistic: true, restore_value: true, initial_value: "17:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k3z2off}", id: gb_k3z2off, optimistic: true, restore_value: true, initial_value: "21:30:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k3z3on}", id: gb_k3z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k3z3off}", id: gb_k3z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k3z4on}", id: gb_k3z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k3z4off}", id: gb_k3z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k4z1on}", id: gb_k4z1on, optimistic: true, restore_value: true, initial_value: "07:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k4z1off}", id: gb_k4z1off, optimistic: true, restore_value: true, initial_value: "23:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k4z2on}", id: gb_k4z2on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k4z2off}", id: gb_k4z2off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k4z3on}", id: gb_k4z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k4z3off}", id: gb_k4z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_gb_k4z4on}", id: gb_k4z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_gb_k4z4off}", id: gb_k4z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: datetime, name: "${n_gb_vac_until}", id: gb_vac_until, optimistic: true, restore_value: true, icon: "mdi:calendar-end" }

select:
  - { platform: template, name: "${n_gb_co_mon}", id: gb_co_mon, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_co_tue}", id: gb_co_tue, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_co_wed}", id: gb_co_wed, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_co_thu}", id: gb_co_thu, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_co_fri}", id: gb_co_fri, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_co_sat}", id: gb_co_sat, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal4}" }
  - { platform: template, name: "${n_gb_co_sun}", id: gb_co_sun, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal4}" }
  - { platform: template, name: "${n_gb_cwu_mon}", id: gb_cwu_mon, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_cwu_tue}", id: gb_cwu_tue, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_cwu_wed}", id: gb_cwu_wed, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_cwu_thu}", id: gb_cwu_thu, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_cwu_fri}", id: gb_cwu_fri, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal1}" }
  - { platform: template, name: "${n_gb_cwu_sat}", id: gb_cwu_sat, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal4}" }
  - { platform: template, name: "${n_gb_cwu_sun}", id: gb_cwu_sun, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_gb_cal1}", "${t_gb_cal2}", "${t_gb_cal3}", "${t_gb_cal4}"], initial_option: "${t_gb_cal4}" }
  - { platform: template, name: "${n_gb_prog_mode}", id: gb_prog_mode, optimistic: true, restore_value: true, icon: "mdi:calendar-clock", options: ["manual", "auto"], initial_option: "manual" }
  - { platform: template, name: "${n_gb_eco_action}", id: gb_eco_action, optimistic: true, restore_value: true, icon: "mdi:leaf", options: ["reduce_flow", "no_request"], initial_option: "reduce_flow" }
  - { platform: template, name: "${n_gb_leg}", id: gb_leg, optimistic: true, restore_value: true, icon: "mdi:bacteria-outline", options: ["off", "weekly", "daily"], initial_option: "off" }
  - { platform: template, name: "${n_gb_vac_action}", id: gb_vac_action, optimistic: true, restore_value: true, icon: "mdi:bag-suitcase-outline", options: ["standby", "summer"], initial_option: "standby" }

number:
  - { platform: template, name: "${n_gb_eco_red}", id: gb_eco_red, icon: "mdi:thermometer-minus", unit_of_measurement: "K", min_value: 0, max_value: 30, step: 1, initial_value: 10, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_gb_dhw_comfort_set}", id: gb_dhw_comfort_set, icon: "mdi:water-thermometer", unit_of_measurement: "°C", min_value: 35, max_value: 65, step: 1, initial_value: 50, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_gb_dhw_eco_set}", id: gb_dhw_eco_set, icon: "mdi:leaf", unit_of_measurement: "°C", min_value: 10, max_value: 65, step: 1, initial_value: 42, restore_value: true, optimistic: true, mode: box }
  - { platform: template, name: "${n_gb_leg_t}", id: gb_leg_t, icon: "mdi:bacteria-outline", unit_of_measurement: "°C", min_value: 55, max_value: 75, step: 1, initial_value: 60, restore_value: true, optimistic: true, mode: box, entity_category: config }
  - { platform: template, name: "${n_gb_win_below}", id: gb_win_below, icon: "mdi:snowflake-thermometer", unit_of_measurement: "°C", min_value: 5, max_value: 20, step: 0.5, initial_value: 15, restore_value: true, optimistic: true, mode: box, entity_category: config }
  - { platform: template, name: "${n_gb_sum_above}", id: gb_sum_above, icon: "mdi:sun-thermometer", unit_of_measurement: "°C", min_value: 10, max_value: 25, step: 0.5, initial_value: 18, restore_value: true, optimistic: true, mode: box, entity_category: config }

switch:
  - { platform: template, name: "${n_gb_dhw_prog}", id: gb_dhw_prog, icon: "mdi:water-boiler-auto", optimistic: true, restore_mode: RESTORE_DEFAULT_OFF }
  - platform: template
    name: "${n_gb_vac}"
    id: gb_vac
    icon: mdi:bag-suitcase-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: |-
          id(gb_vac_mode_before) = (int) id(gb_mode).active_index().value_or(3);
          auto c = id(gb_mode).make_call();
          c.set_index(id(gb_vac_action).current_option() == std::string("summer") ? 1 : 0);   // DHW only / standby
          c.perform();
    on_turn_off:
      - lambda: |-
          int b = id(gb_vac_mode_before);
          if (b >= 0) { auto c = id(gb_mode).make_call(); c.set_index(b); c.perform(); }
          id(gb_vac_mode_before) = -1;
  - { platform: template, name: "${n_gb_season}", id: gb_season_auto, icon: "mdi:sun-snowflake-variant", optimistic: true, restore_mode: RESTORE_DEFAULT_OFF }

binary_sensor:
  - { platform: template, name: "${n_gb_leg_run}", id: gb_leg_run, icon: "mdi:bacteria", lambda: "return id(gb_leg_run_g);" }

text_sensor:
  # phases as keys (the cards translate them): comfort / economy / manual / legionella
  - { platform: template, name: "${n_gb_phase}", id: gb_phase, icon: "mdi:calendar-clock" }
  - { platform: template, name: "${n_gb_dhw_phase}", id: gb_dhw_phase, icon: "mdi:calendar-clock" }

sensor:
  - { platform: template, name: "${n_gb_out_mean}", id: gb_out_mean, icon: "mdi:thermometer-auto", unit_of_measurement: "°C", device_class: temperature, accuracy_decimals: 1 }

interval:
  - interval: 30s
    then:
      - lambda: |-
          auto now = id(gb_time).now();
          // ---- 24 h outdoor mean: a half-hour mean every 60 samples, the last 48 kept
          float out = id(gb_outdoor_temp).state;
          if (!std::isnan(out)) { id(gb_out_sum) += out; id(gb_out_n)++; }
          if (id(gb_out_n) >= 60) {
            auto &h = id(gb_out_hist);
            h.push_back(id(gb_out_sum) / id(gb_out_n));
            if (h.size() > 48) h.erase(h.begin());
            id(gb_out_sum) = 0; id(gb_out_n) = 0;
          }
          {
            auto &h = id(gb_out_hist);
            float s = 0; for (float v : h) s += v;
            int n = h.size();
            float cur = id(gb_out_n) > 0 ? id(gb_out_sum) / id(gb_out_n) : NAN;
            float mean = n > 0 ? s / n : cur;
            if (!std::isnan(mean)) id(gb_out_mean).publish_state(mean);
            // ---- automatic Summer / Winter (after 6 h of data), only between DHW only and heating + DHW, not in a vacation
            int mi = (int) id(gb_mode).active_index().value_or(0);
            if (id(gb_season_auto).state && !id(gb_vac).state && n >= 12 && (mi == 1 || mi == 3)) {
              int want = mean < id(gb_win_below).state ? 1 : mean > id(gb_sum_above).state ? 0 : id(gb_season);
              if (want >= 0 && want != id(gb_season)) {
                id(gb_season) = want;
                auto c = id(gb_mode).make_call(); c.set_index(want ? 3 : 1); c.perform();
                ESP_LOGI("gb_programs", "24 h mean %.1f -> %s", mean, want ? "Winter" : "Summer");
              }
            }
          }
          if (!now.is_valid()) return;
          // ---- vacation end
          if (id(gb_vac).state && id(gb_vac_until).has_state()) {
            auto u = id(gb_vac_until).state_as_esptime();
            u.recalc_timestamp_local();
            if (u.is_valid() && now.timestamp >= u.timestamp) { id(gb_vac).turn_off(); ESP_LOGI("gb_programs", "vacation ended"); }
          }
          datetime::TimeEntity *cal[4][8] = {
            {id(gb_k1z1on), id(gb_k1z1off), id(gb_k1z2on), id(gb_k1z2off), id(gb_k1z3on), id(gb_k1z3off), id(gb_k1z4on), id(gb_k1z4off)},
            {id(gb_k2z1on), id(gb_k2z1off), id(gb_k2z2on), id(gb_k2z2off), id(gb_k2z3on), id(gb_k2z3off), id(gb_k2z4on), id(gb_k2z4off)},
            {id(gb_k3z1on), id(gb_k3z1off), id(gb_k3z2on), id(gb_k3z2off), id(gb_k3z3on), id(gb_k3z3off), id(gb_k3z4on), id(gb_k3z4off)},
            {id(gb_k4z1on), id(gb_k4z1off), id(gb_k4z2on), id(gb_k4z2off), id(gb_k4z3on), id(gb_k4z3off), id(gb_k4z4on), id(gb_k4z4off)}
          };
          int m = now.hour * 60 + now.minute;
          auto in_cal = [&](int c) {
            if (c < 0 || c > 3) return false;
            for (int f = 0; f < 4; f++) {
              int a = cal[c][2 * f]->hour * 60 + cal[c][2 * f]->minute;
              int b = cal[c][2 * f + 1]->hour * 60 + cal[c][2 * f + 1]->minute;
              if (a == b) continue;
              if (b == 0) b = 1440;
              if (a < b ? (m >= a && m < b) : (m >= a || m < b)) return true;
            }
            return false;
          };
          int wd = (now.day_of_week + 5) % 7;
          select::Select *co[7] = {id(gb_co_mon), id(gb_co_tue), id(gb_co_wed), id(gb_co_thu), id(gb_co_fri), id(gb_co_sat), id(gb_co_sun)};
          select::Select *cw[7] = {id(gb_cwu_mon), id(gb_cwu_tue), id(gb_cwu_wed), id(gb_cwu_thu), id(gb_cwu_fri), id(gb_cwu_sat), id(gb_cwu_sun)};
          // ---- CH program AUTO: Eco lowers the flow (the curve or the setpoint) or drops the heat request
          bool autop = id(gb_prog_mode).current_option() == std::string("auto") && !id(gb_vac).state;
          int ph = autop ? (in_cal((int) co[wd]->active_index().value_or(0)) ? 1 : 0) : -2;
          if (ph != id(gb_phase_last)) {
            int was = id(gb_phase_last);
            id(gb_phase_last) = ph;
            id(gb_phase).publish_state(ph == 1 ? "comfort" : ph == 0 ? "economy" : "manual");
            bool reduce = id(gb_eco_action).current_option() == std::string("reduce_flow");
            float red = ph == 0 && reduce ? -id(gb_eco_red).state : 0.0f;
            id(gb_eco_shift) = red;
            if (!id(gb_curve).state) {
              // no curve: lower / restore the setpoint itself
              if (ph == 0 && reduce) {
                id(gb_flow_before) = id(gb_ch_setpoint).state;
                auto c = id(gb_ch_setpoint).make_call(); c.set_value(id(gb_ch_setpoint).state + red); c.perform();
              } else if (was == 0 && !std::isnan(id(gb_flow_before))) {
                auto c = id(gb_ch_setpoint).make_call(); c.set_value(id(gb_flow_before)); c.perform();
                id(gb_flow_before) = NAN;
              }
            }
            // Eco without a heat request: CH stands
            if (ph == 0 && !reduce) id(gb_heat_request).turn_off();
            else if (was == 0 && !reduce) id(gb_heat_request).turn_on();
            ESP_LOGI("gb_programs", "CH program: %s", ph == 1 ? "Comfort" : ph == 0 ? "Eco" : "manual");
          }
          // ---- anti-legionella
          std::string leg = id(gb_leg).current_option();
          float tank = id(gb_dhw_temp).state, dmax = id(gb_dhw_max).state;
          float lt = std::isnan(dmax) ? id(gb_leg_t).state : std::min(id(gb_leg_t).state, dmax);
          if (!id(gb_leg_run_g) && leg != "off" && now.hour == 2 && now.minute < 5 && id(gb_leg_day_done) != now.day_of_year
              && (leg == "daily" || now.day_of_week == 2)) {
            id(gb_leg_run_g) = true; id(gb_leg_start) = millis(); id(gb_leg_hold) = 0; id(gb_leg_day_done) = now.day_of_year;
            id(gb_leg_dhw_before) = id(gb_dhw_setpoint).state;
            auto c = id(gb_dhw_setpoint).make_call(); c.set_value(lt); c.perform();
            id(gb_dhw_phase).publish_state("legionella");
            ESP_LOGW("gb_programs", "anti-legionella start: DHW %.0f", lt);
          }
          if (id(gb_leg_run_g)) {
            if (!std::isnan(tank) && tank >= lt - 1.0f) { if (!id(gb_leg_hold)) id(gb_leg_hold) = millis(); } else id(gb_leg_hold) = 0;
            bool done = (id(gb_leg_hold) && millis() - id(gb_leg_hold) >= 1200000UL) || millis() - id(gb_leg_start) >= 7200000UL || leg == "off";
            if (done) {
              id(gb_leg_run_g) = false; id(gb_dhw_phase_last) = -1;
              if (!std::isnan(id(gb_leg_dhw_before))) { auto c = id(gb_dhw_setpoint).make_call(); c.set_value(id(gb_leg_dhw_before)); c.perform(); }
              ESP_LOGW("gb_programs", "anti-legionella end");
            }
            return;
          }
          // ---- DHW program
          if (id(gb_dhw_prog).state) {
            bool comfort = in_cal((int) cw[wd]->active_index().value_or(0));
            int dph = comfort ? 1 : 0;
            if (dph != id(gb_dhw_phase_last)) {
              id(gb_dhw_phase_last) = dph;
              id(gb_dhw_phase).publish_state(comfort ? "comfort" : "economy");
              float t = comfort ? id(gb_dhw_comfort_set).state : id(gb_dhw_eco_set).state;
              if (!std::isnan(t)) { auto c = id(gb_dhw_setpoint).make_call(); c.set_value(t); c.perform(); }
            }
          } else if (id(gb_dhw_phase_last) != -2) {
            id(gb_dhw_phase_last) = -2;
            id(gb_dhw_phase).publish_state("manual");
          }
