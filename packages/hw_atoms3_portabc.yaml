# IMMERGAS Modbus BMS NASA OpenTherm HUB - package "hw_atoms3_portabc"
# Hardware profile: AtomS3 (Lite) + ATOMIC PortABC + 3x M5Stack Isolated RS485 Unit (auto direction).
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.
# The isolated units switch the direction themselves, so the DE pins of the dd_ / tt_ packages are removed; T-/T+ is
# received with 1 stop bit (the boiler sends 8N2, the ESP32-S3 UART with 2 stop bits corrupted the replies).
# --- T-/T+: 1 bit stopu po stronie huba ---
# Kocioł nadaje 8N2. Odbiornik 8N1 czyta to poprawnie (drugi bit stopu = cisza), a przy 8N2 UART ESP32-S3 psuł
# odpowiedź od 2. bajtu (0B 20 00 20 D1 zamiast 0B 03 02 00 00 20 45). Kocioł przyjmuje nasze ramki 8N1.
uart:
  - id: !extend tt_uart
    stop_bits: 1
  # Isolated RS485 Unit = auto-kierunek -> bez pinu DE (zwalnia dolny Grove)
  - id: !extend dd_uart
    flow_control_pin: !remove

modbus:
  - id: !extend tt_modbus
    flow_control_pin: !remove
