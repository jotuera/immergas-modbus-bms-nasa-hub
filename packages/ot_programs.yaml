# Immergas OpenTherm - package "ot_programs" (optional, master mode with ot_regulator)
# The programs a CAR V2 / Dominus keeps, run in the hub - they work without Home Assistant (only its time):
#   - CH program AUTO: Comfort / Eco room target by 4 calendars (4 ranges each) and a calendar per weekday;
#   - DHW program: Comfort / Eco DHW setpoint by the same calendars, own weekday assignment;
#   - anti-legionella: weekly (Monday) or daily at 02:00 the DHW setpoint goes to the anti-legionella temperature (capped
#     by the boiler's DHW max.) until the cylinder holds it for 20 min (at most 2 h);
#   - vacation: Standby or Summer until the end date (or until switched off), then the mode from before;
#   - automatic Summer / Winter by the 24 h outdoor mean (Winter below, Summer above the thresholds);
#   - frost protection: CH on whatever the mode while the room is below the threshold (+1 K to stop).
# Needs ot_core (time), ot_control (mode) and ot_regulator (room target and temperature).
# Part of jotuera/immergas-modbus-bms-nasa-opentherm-hub (PolyForm Noncommercial 1.0.0). Loaded by the main YAML through `packages:`.

globals:
  - { id: ot_phase_last, type: int, initial_value: "-1" }       # CH program: 1 Comfort, 0 Eco
  - { id: ot_dhw_phase_last, type: int, initial_value: "-1" }
  - { id: ot_leg_run_g, type: bool, initial_value: "false" }
  - { id: ot_leg_start, type: uint32_t, initial_value: "0" }    # millis() of the start
  - { id: ot_leg_hold, type: uint32_t, initial_value: "0" }     # millis() when the cylinder reached the temperature
  - { id: ot_leg_day_done, type: int, initial_value: "-1" }     # day of year of the last run
  - { id: ot_leg_dhw_before, type: float, initial_value: "NAN" }
  - { id: ot_vac_mode_before, type: int, restore_value: true, initial_value: "-1" }  # mode index before the vacation
  - { id: ot_season, type: int, restore_value: true, initial_value: "-1" }         # 1 winter, 0 summer
  - { id: ot_out_sum, type: float, initial_value: "0" }
  - { id: ot_out_n, type: int, initial_value: "0" }
  - { id: ot_out_hist, type: "std::vector<float>" }             # half-hour means, the last 48 = 24 h

datetime:
  - { platform: template, type: time, name: "${n_ot_k1z1on}", id: ot_k1z1on, optimistic: true, restore_value: true, initial_value: "06:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k1z1off}", id: ot_k1z1off, optimistic: true, restore_value: true, initial_value: "22:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k1z2on}", id: ot_k1z2on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k1z2off}", id: ot_k1z2off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k1z3on}", id: ot_k1z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k1z3off}", id: ot_k1z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k1z4on}", id: ot_k1z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k1z4off}", id: ot_k1z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k2z1on}", id: ot_k2z1on, optimistic: true, restore_value: true, initial_value: "06:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k2z1off}", id: ot_k2z1off, optimistic: true, restore_value: true, initial_value: "08:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k2z2on}", id: ot_k2z2on, optimistic: true, restore_value: true, initial_value: "15:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k2z2off}", id: ot_k2z2off, optimistic: true, restore_value: true, initial_value: "22:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k2z3on}", id: ot_k2z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k2z3off}", id: ot_k2z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k2z4on}", id: ot_k2z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k2z4off}", id: ot_k2z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k3z1on}", id: ot_k3z1on, optimistic: true, restore_value: true, initial_value: "05:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k3z1off}", id: ot_k3z1off, optimistic: true, restore_value: true, initial_value: "07:30:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k3z2on}", id: ot_k3z2on, optimistic: true, restore_value: true, initial_value: "17:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k3z2off}", id: ot_k3z2off, optimistic: true, restore_value: true, initial_value: "21:30:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k3z3on}", id: ot_k3z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k3z3off}", id: ot_k3z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k3z4on}", id: ot_k3z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k3z4off}", id: ot_k3z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k4z1on}", id: ot_k4z1on, optimistic: true, restore_value: true, initial_value: "07:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k4z1off}", id: ot_k4z1off, optimistic: true, restore_value: true, initial_value: "23:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k4z2on}", id: ot_k4z2on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k4z2off}", id: ot_k4z2off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k4z3on}", id: ot_k4z3on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k4z3off}", id: ot_k4z3off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - { platform: template, type: time, name: "${n_ot_k4z4on}", id: ot_k4z4on, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-start" }
  - { platform: template, type: time, name: "${n_ot_k4z4off}", id: ot_k4z4off, optimistic: true, restore_value: true, initial_value: "00:00:00", entity_category: config, icon: "mdi:clock-end" }
  - platform: template
    type: datetime
    name: "${n_ot_vac_until}"
    id: ot_vac_until
    optimistic: true
    restore_value: true
    icon: mdi:calendar-end

select:
  - { platform: template, name: "${n_ot_co_mon}", id: ot_co_mon, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_ot_cal1}", "${t_ot_cal2}", "${t_ot_cal3}", "${t_ot_cal4}"], initial_option: "${t_ot_cal1}" }
  - { platform: template, name: "${n_ot_co_tue}", id: ot_co_tue, optimistic: true, restore_value: true, entity_category: config, icon: "mdi:calendar-today", options: ["${t_ot_cal1}", "${t_ot_cal2}", "${t_ot_cal3}", "${t_ot_cal4}"], initial_option: "${t_ot_cal1}" }
