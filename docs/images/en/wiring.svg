<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 790" width="1130" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#212529">
<title>Wiring of the hub to the three buses</title>
