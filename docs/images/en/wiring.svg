<text x="612" y="564" text-anchor="middle" font-weight="700" fill="#e8590c">A</text>
<text x="612" y="592" text-anchor="middle" font-weight="700" fill="#1c7ed6">B</text>
<line x1="630" y1="559" x2="745" y2="559" stroke="#e8590c" stroke-width="3"/>
<line x1="630" y1="587" x2="745" y2="587" stroke="#1c7ed6" stroke-width="3"/>
<circle cx="630" cy="559" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/>
<circle cx="630" cy="587" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/>
<text x="642" y="610" font-size="12" fill="#868e96">no resistor</text>
<rect x="725" y="200" width="300" height="440" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
<text x="875" y="228" text-anchor="middle" font-weight="700" font-size="16">Immergas Magis indoor unit</text>
<text x="875" y="247" text-anchor="middle" font-size="12" fill="#495057">bus terminals</text>
<rect x="745" y="300" width="52" height="62" rx="6" fill="#dee2e6" stroke="#495057"/>
<circle cx="757" cy="319" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/>
<text x="770" y="324" font-weight="700" font-size="13" fill="#e8590c">D+</text>
<circle cx="757" cy="347" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/>
<text x="770" y="352" font-weight="700" font-size="13" fill="#1c7ed6">D-</text>
<text x="810" y="316" font-weight="700" font-size="13">D+/D- · Modbus 9600 8E1</text>
<text x="810" y="334" font-size="12" fill="#495057">zone panel 0x29 · Dominus 0x33</text>
<text x="810" y="351" font-size="12" fill="#495057">hub listens and emulates</text>
<rect x="745" y="420" width="52" height="62" rx="6" fill="#dee2e6" stroke="#495057"/>
<circle cx="757" cy="439" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/>
<text x="770" y="444" font-weight="700" font-size="13" fill="#e8590c">F1</text>
<circle cx="757" cy="467" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/>
<text x="770" y="472" font-weight="700" font-size="13" fill="#1c7ed6">F2</text>
<text x="810" y="436" font-weight="700" font-size="13">F1/F2 · Samsung NASA 8E1</text>
<text x="810" y="454" font-size="12" fill="#495057">line to the outdoor unit</text>
<text x="810" y="471" font-size="12" fill="#495057">hub listens in parallel</text>
<rect x="745" y="540" width="52" height="62" rx="6" fill="#dee2e6" stroke="#495057"/>
<circle cx="757" cy="559" r="6" fill="#fff" stroke="#e8590c" stroke-width="2.5"/>
<text x="770" y="564" font-weight="700" font-size="13" fill="#e8590c">T-</text>
<circle cx="757" cy="587" r="6" fill="#fff" stroke="#1c7ed6" stroke-width="2.5"/>
<text x="770" y="592" font-weight="700" font-size="13" fill="#1c7ed6">T+</text>
<text x="810" y="556" font-weight="700" font-size="13">T-/T+ · BMS Modbus</text>
<text x="810" y="574" font-size="12" fill="#495057">hub = master, boiler = slave 11</text>
<text x="810" y="591" font-size="12" fill="#495057">boiler 8N2, hub 1 stop bit</text>
<line x1="1025" y1="439" x2="1045" y2="439" stroke="#e8590c" stroke-width="3"/>
<line x1="1025" y1="467" x2="1045" y2="467" stroke="#1c7ed6" stroke-width="3"/>
<rect x="1045" y="400" width="70" height="100" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
<text x="1080" y="432" text-anchor="middle" font-size="12" font-weight="600">Outdoor</text>
<text x="1080" y="448" text-anchor="middle" font-size="12" font-weight="600">unit</text>
<text x="1080" y="480" text-anchor="middle" font-size="10" fill="#495057">Samsung EHS</text>
<text x="40" y="672" font-size="14" font-weight="600" xml:space="preserve">A ← D+ · F1 · T-      B ← D- · F2 · T+      (silent bus or CRC errors → swap A and B)</text>
<text x="40" y="700" font-size="14"><tspan fill="#2b8a3e" font-weight="700">●</tspan> 120 Ω resistor in the A-B terminals of the D+/D- unit: the boiler biases this bus but does not terminate it (without it: E121).</text>
<text x="40" y="726" font-size="14"><tspan fill="#adb5bd" font-weight="700">●</tspan> F1/F2 and T-/T+: no resistor, the hub joins in the middle of the line.</text>
<text x="40" y="752" font-size="14"><tspan fill="#e03131" font-weight="700">●</tspan> Power the hub from its own USB charger, not from the indoor unit: a shared supply can disturb the ground of the buses.</text>
</svg>
