<text x="60" y="566" font-weight="700" font-size="16" fill="#1971c2">Port C</text>
<text x="60" y="586" font-size="12" fill="#495057">RX G6 · TX G5</text>
<rect x="262" y="550" width="40" height="40" rx="5" fill="#1971c2" stroke="#212529"/>
